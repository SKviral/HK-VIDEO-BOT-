<style>
:root{--bg:#15123b;--card:#241f5e;--ink:#fff7e6;--mut:#a9a3d9;--sun:#ffc83d;--coral:#ff6b4a;--mint:#3ee0a0;--sky:#5cc8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;overflow:hidden}
.bgp{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scr{display:none;position:relative;z-index:1;height:100%;max-width:430px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));flex-direction:column}
.scr.on{display:flex}
.hd{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.hd svg{width:56px;height:56px;flex:none}
.hd h1{margin:0;font-size:30px;line-height:1.1}
.hd p{margin:2px 0 0;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;overflow:auto;padding-bottom:8px}
.gc{background:var(--card);border:0;border-radius:24px;padding:12px 12px 14px;color:var(--ink);font:inherit;text-align:left;cursor:pointer;box-shadow:0 6px 0 #0f0c2e;transition:transform .12s;animation:rise .45s backwards cubic-bezier(.2,.9,.3,1.2)}
.gc:active{transform:translateY(4px);box-shadow:0 2px 0 #0f0c2e}
.gc .ic{border-radius:16px;aspect-ratio:1;display:grid;place-items:center;margin-bottom:10px}
.gc .ic svg{width:78%;height:78%}
.gc b{display:block;font-size:18px}
.gc span{font-size:13px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar h2{margin:0;font-size:20px;flex:1}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 #0f0c2e}
.ib svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:14px;padding:0 14px;height:44px;font-weight:700;font-size:18px}
.pill svg{width:18px;height:18px}
.stage{flex:1;display:grid;place-items:center;position:relative;min-height:0}
#cv{width:min(100%,calc((100vh - 250px)*.75));width:min(100%,calc((100dvh - 250px)*.75));aspect-ratio:3/4;border-radius:20px;background:#000;box-shadow:0 8px 0 #0c0a26;touch-action:none}
#ov{position:absolute;inset:0;margin:auto;width:min(100%,calc((100dvh - 250px)*.75));aspect-ratio:3/4;border-radius:20px;background:rgba(21,18,59,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
#ov.on{display:flex;animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
#ov.on svg{animation:bob 1.3s ease-in-out infinite}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
@keyframes rise{from{transform:translateY(24px) scale(.92);opacity:0}}
#mute .x{display:none}#mute.off .x{display:inline}#mute.off .w{display:none}
#ov svg{width:84px;height:84px}
#ov h3{margin:0;font-size:28px}
#ov p{margin:0;color:var(--mut)}
.btn{border:0;border-radius:16px;padding:12px 26px;font:700 18px inherit;font-family:inherit;cursor:pointer;color:#15123b;background:var(--sun);box-shadow:0 5px 0 #b88a00}
.btn.g{background:var(--card);color:var(--ink);box-shadow:0 5px 0 #0f0c2e}
.btn:active{transform:translateY(3px)}
#ctl{height:132px;display:flex;align-items:center;justify-content:space-between;padding-top:10px}
#ctl button{width:64px;height:64px;border-radius:20px;border:0;background:var(--card);box-shadow:0 5px 0 #0f0c2e;display:grid;place-items:center;touch-action:none}
#ctl button svg{width:30px;height:30px;fill:var(--ink);transform:rotate(var(--r))}
#ctl button:active{background:#352e82}
#ctl .jmp{width:auto;padding:0 34px;height:72px;background:var(--coral);color:#fff;font:700 20px inherit;font-family:inherit;box-shadow:0 5px 0 #a8321b}
#ctl.tap{justify-content:center}
#ctl.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:64px 64px;gap:4px;justify-content:center}
#ctl.dpad button:nth-child(1){grid-column:2;grid-row:1}
#ctl.dpad button:nth-child(2){grid-column:1;grid-row:2}
#ctl.dpad button:nth-child(3){grid-column:2;grid-row:2}
#ctl.dpad button:nth-child(4){grid-column:3;grid-row:2}
#ctl.none{display:none}
#lbBtn{margin-left:auto}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-radius:14px;padding:9px 16px;font:inherit;font-weight:600;font-size:15px;white-space:nowrap;background:var(--card);color:var(--mut);cursor:pointer;box-shadow:0 4px 0 #0f0c2e}
.tab.on{background:var(--sun);color:#15123b;box-shadow:0 4px 0 #b88a00}
.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0;padding:2px 2px 6px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:8px 14px 8px 10px;flex:none}
.row .rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--mut);flex:none}
.row.r1 .rk{background:#ffc83d;color:#15123b}.row.r2 .rk{background:#d5dbe6;color:#15123b}.row.r3 .rk{background:#e09a5b;color:#15123b}
.row .av{width:40px;height:40px;flex:none}
.row .nm{flex:1;font-weight:500;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pt{font-weight:700;font-size:18px;color:var(--sun)}

#mine{flex:none;padding:8px 2px 0}
.lv{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 14px;margin-bottom:12px;box-shadow:0 6px 0 #0f0c2e;flex:none}
.lvl{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lvl>span{font-size:13px;color:var(--mut)}
.hearts{display:flex;align-items:center;gap:4px}
.hearts svg{width:28px;height:28px;fill:var(--coral)}
.hearts svg.e{fill:#38308a}
.hearts .ex{font-weight:700;font-size:17px;color:var(--sun);margin-left:4px}
.btn.sm{padding:10px 14px;font-size:15px;box-shadow:0 4px 0 #b88a00;flex:none}
.btn.sm svg{width:14px;height:14px;fill:#15123b;margin-right:6px;vertical-align:-1px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,8,34,.8);display:none;place-items:center;padding:24px}
.modal.on{display:grid}
.mbox{width:min(100%,340px);background:var(--card);border-radius:28px;padding:24px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 8px 0 #0f0c2e;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}

.mbox h3{margin:0;font-size:26px}

.mbox .btn{width:100%}

.pf{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:10px 14px;margin-bottom:12px;box-shadow:0 6px 0 #0f0c2e;flex:none}
.lvb{width:44px;height:44px;border-radius:14px;background:var(--sky);color:#15123b;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.pfm{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pfn{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp{height:8px;background:#38308a;border-radius:6px;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:var(--mint);border-radius:6px;transition:width .4s}
.pfm span{font-size:12px;color:var(--mut)}
.coin{display:flex;align-items:center;gap:6px;font-weight:700;font-size:18px;color:var(--sun)}
.coin svg{width:22px;height:22px}
.chips{display:grid;grid-template-columns:1fr 1fr 1fr 48px;gap:10px;margin-bottom:14px;flex:none}
.chip{position:relative;border:0;border-radius:16px;background:var(--card);color:var(--ink);font:600 15px inherit;font-family:inherit;padding:10px 6px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 4px 0 #0f0c2e}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 #0f0c2e}
.chip svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:5px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--coral);display:none}
.dot.on{display:block}
#ov #orw{color:var(--sun);font-weight:600}
.mbox .dg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin-bottom:6px}
.dt{background:#1b1750;border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut)}
.dt b{color:var(--sun);font-size:18px}
.dt.done{background:#1f5a4a}.dt.done::after{content:'✓';color:var(--mint);font-weight:700}
.dt.now{background:#34297a;outline:3px solid var(--sun);outline-offset:-3px}
.dt:last-child{grid-column:span 2}
.btn.dis{opacity:.45}
.mbox .al{width:100%;max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:4px}
.ar{display:flex;align-items:center;gap:10px;background:#1b1750;border-radius:14px;padding:8px 10px}
.ai{width:28px;height:28px;border-radius:50%;background:#38308a;color:#15123b;display:grid;place-items:center;font-weight:700;flex:none}
.ar.ok .ai{background:var(--mint)}
.at{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.at b{font-size:15px}.at small{font-size:12px;color:var(--mut)}
.pb{height:5px;background:#38308a;border-radius:4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--sun)}
.ar.ok .pb i{background:var(--mint)}
.ar em{font-style:normal;font-weight:700;color:var(--sun);font-size:14px}
.mbox p.sm{font-size:13px;margin:0}
#ctl .jmp.alt{background:var(--sky);color:#15123b;box-shadow:0 5px 0 #2a8fc0}
.gc.hero{grid-column:span 2}
.gc.hero .ic{aspect-ratio:2.2/1}
.gc small{display:block;color:var(--mut);font-size:13px;margin:2px 0 4px}
.chip.q{padding:10px 0}
.note{margin:0 2px 10px;font-size:13px;color:var(--mut)}
.orow{display:flex;gap:10px}
.orow .btn{padding:10px 18px;font-size:16px}
.hp{background:#1b1750;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.hp b{font-size:15px}.hp span{font-size:13px;color:var(--mut)}
@media(max-height:700px){#ov svg{width:56px;height:56px}#ov h3{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const $=s=>document.querySelector(s),W=360,H=480,cv=$('#cv'),c=cv.getContext('2d');
const tg=window.Telegram&&Telegram.WebApp;
try{tg&&(tg.ready(),tg.expand(),tg.setHeaderColor&&tg.setHeaderColor('#15123b'),tg.setBackgroundColor&&tg.setBackgroundColor('#15123b'),tg.disableVerticalSwipes&&tg.disableVerticalSwipes())}catch(e){}
const hap=t=>{try{tg.HapticFeedback.notificationOccurred(t)}catch(e){}};
let best={};try{best=JSON.parse(localStorage.gh||'{}')}catch(e){}
const save=()=>{try{localStorage.gh=JSON.stringify(best)}catch(e){}};
let cur=null,cid='',raf=0,last=0,score=0,over=0;
const K={l:0,r:0,j:0},rnd=n=>Math.floor(Math.random()*n);
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
/* ---------- Sound (WebAudio) ---------- */
let AC=null,mute=false;try{mute=localStorage.gm=='1'}catch(e){}
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC}
function tone(f,d,ty,v,to,dl){if(mute)return;const a=au();if(!a)return;const t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();
 o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
 g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
const SFX={
 jump:()=>tone(300,.22,'square',.09,760),
 coin:()=>{tone(988,.07,'square',.08);tone(1319,.22,'square',.08,0,.07)},
 stomp:()=>{tone(260,.16,'square',.12,70)},
 bump:()=>tone(160,.08,'triangle',.14,90),
 die:()=>{[392,330,262,196].forEach((f,i)=>tone(f,.2,'triangle',.15,0,i*.15))},
 win:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,.16,'square',.09,0,i*.1))},
 eat:()=>{tone(520,.09,'square',.09,1040)},
 move:()=>tone(220,.04,'triangle',.06),
 flap:()=>tone(360,.12,'sine',.15,640),
 point:()=>{tone(880,.06,'square',.07);tone(1175,.14,'square',.07,0,.06)},
 tap:()=>tone(520,.07,'triangle',.12,700),
 ai:()=>tone(380,.08,'triangle',.12,260)};
const sfx=n=>{try{SFX[n]()}catch(e){}};
/* ---------- Particles and shake ---------- */
const PT=[];let shk=0;
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(.4+Math.random())*(sp||2);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,l:1,c:Array.isArray(col)?col[rnd(col.length)]:col})}}
function stepP(f){for(const p of PT){p.x+=p.vx*f;p.y+=p.vy*f;p.vy+=.12*f;p.l-=.025*f}
 for(let i=PT.length-1;i>=0;i--)if(PT[i].l<=0)PT.splice(i,1);if(shk>0)shk=Math.max(0,shk-f)}
function drawP(){for(const p of PT){c.globalAlpha=Math.max(0,p.l);c.fillStyle=p.c;c.fillRect(p.x-2,p.y-2,4,4)}c.globalAlpha=1}
function end(m){if(over)return;over=1;const w=m&&m.includes('win');

 sfx('win');toast('+'+r.c+' coins'+(r.l?' · +1 life':''));chk();closeM()}

 for(const a of ACH){const v=Math.min(a.v(),a.t),ok=P.ach[a.id];

 openM(`<h3>Badges</h3><p>${n} of ${ACH.length} unlocked</p><div class="al">${t}</div><button class="btn g" data-a="x">Close</button>`)}

 <button class="btn${P.coins<120?' dis':''}" data-a="b1">1 life · 120 coins</button>

 return NM.map((n,i)=>({n,i,s:Math.max(st,Math.round(mx*Math.pow(R(),2.2)/st)*st)}))}

 return `<svg class="av" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="${b}"/><path d="M7 40c0-8 5-11 13-11s13 3 13 11z" fill="#fff7e6" opacity=".9"/><circle cx="20" cy="18" r="9" fill="#ffd2a1"/>${hair}<circle cx="16.5" cy="19" r="1.3" fill="#15123b"/><circle cx="23.5" cy="19" r="1.3" fill="#15123b"/><path d="M17 22.5q3 2.5 6 0" stroke="#15123b" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>`}

addEventListener('blur',()=>{K.l=K.r=K.j=0;Object.keys(held).forEach(i=>delete held[i])});
addEventListener('pointerdown',()=>{au()},true);

addEventListener('keydown',e=>{if(!cur)return;const k=e.key;

addEventListener('keyup',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a')K.l=0;if(k=='ArrowRight'||k=='d')K.r=0;if(k=='ArrowUp'||k=='w'||k==' ')K.j=0});
